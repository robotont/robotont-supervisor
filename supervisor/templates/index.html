<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supervisor</title>

    <style>
      :root {
        --primary: #1abc9c;
        --accent:  #fbbf24;
        --error:   #ef4444;
        --bg:      #f9fafb;
        --text:    #111827;
        --border:  #e5e7eb;
      }
      *,*::before,*::after{box-sizing:border-box}
      body{
        margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--text);
        display:flex; justify-content:center; padding:2rem;
      }
      .wrapper{width:min(680px,100%)}
      h1{margin:0 0 1rem;font-size:1.5rem;font-weight:600;text-align:center}

      /* ---------- desktop table ---------- */
      table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:0.5rem;overflow:hidden}
      thead th{padding:0.75rem;font-weight:600;text-align:left;background:#f3f4f6;border-bottom:2px solid var(--border)}
      tbody td{padding:0.75rem;border-bottom:1px solid var(--border);vertical-align:middle}
      tbody tr:last-child td{border-bottom:none}
      tr:hover{background:#f1f5f9}

      button{border:none;cursor:pointer;padding:0.4rem 0.8rem;border-radius:0.375rem;font-size:0.875rem;background:var(--primary);color:#fff;transition:opacity .15s}
      button:hover:not([disabled]){opacity:.9}
      button[disabled]{opacity:.5;cursor:default}

      .status-dot{display:inline-block;width:0.65rem;height:0.65rem;border-radius:50%;margin-right:0.4rem}
      .status-running  {background:var(--primary)}
      .status-starting,.status-stopping,.status-restarting{background:var(--accent)}
      .status-paused,.status-created {background:#d97706}
      .status-stopped  {background:#9ca3af}
      .status-error    {background:var(--error)}
      .status-unknown  {background:#6b7280}

      /* ---------- mobile (<640px) ---------- */
      @media(max-width:640px){
        body{padding:1rem}
        table,thead,tbody,tr,td,th{display:block;width:100%}
        thead{display:none}
        tr{margin-bottom:1rem;border:1px solid var(--border);border-radius:0.5rem;padding:0.75rem;background:#fff}
        td{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0}
        td::before{content:attr(data-label);font-weight:600;margin-right:0.5rem;flex:0 0 auto}
        button{flex:1;margin-left:0.25rem;min-height:44px} /* tap‑friendly */
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <h1>Container Supervisor</h1>
      <table id="container-table">
        <thead><tr><th>Service</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </main>

    <script>
      const API = {
        list:'/containers',
        start:'/containers/start',
        stop:'/containers/stop'
      };
      const POLL_MS = 2000;
      const tbody   = document.querySelector('#container-table tbody');

      const pending = new Map();

      const STATUS = {
        running   : {cls:'running'},   starting:{cls:'starting'},
        stopping  : {cls:'stopping'},  restarting:{cls:'restarting'},
        paused    : {cls:'paused'},    created  :{cls:'created'},
        stopped   : {cls:'stopped'},   error    :{cls:'error'},
        unknown   : {cls:'unknown'}
      };

      const json = (url,opts)=>fetch(url,opts).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error(t||r.statusText))));

      function htmlRow(service,status){
        const {cls}=STATUS[status]||STATUS.unknown;
        const isRunning = status==='running' || status==='starting';
        return `<tr data-service="${service}">
          <td data-label="Service">${service}</td>
          <td data-label="Status"><span class="status-dot status-${cls}"></span>${status}</td>
          <td data-label="Actions">
            <button data-cmd="start" ${isRunning?'disabled':''}>Start</button>
            <button data-cmd="stop"  ${!isRunning?'disabled':''}>Stop</button>
          </td>
        </tr>`;
      }

      async function render(){
        try{
          const data = await json(API.list);
          const rows = Object.entries(data).map(([svc,backendStatus])=>{
            const pend = pending.get(svc);
            let status = backendStatus;
            if(pend==='start'){
              if(backendStatus==='running') pending.delete(svc);
              else status = 'starting';
            }else if(pend==='stop'){
              if(backendStatus==='stopped') pending.delete(svc);
              else status = 'stopping';
            }
            return htmlRow(svc,status);
          }).join('');
          tbody.innerHTML = rows;
        }catch(e){console.error(e)}
      }

      tbody.addEventListener('click',async e=>{
        const btn=e.target.closest('button[data-cmd]');
        if(!btn) return;
        const tr=btn.closest('tr');
        const svc=tr.dataset.service, cmd=btn.dataset.cmd;
        pending.set(svc, cmd==='start'?'start':'stop');
        render();
        try{
          await json(API[cmd],{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:svc})
          });
        }catch(err){
          alert(err.message); pending.delete(svc); render();
        }
      });

      render();
      setInterval(render, POLL_MS);
    </script>
  </body>
</html>
